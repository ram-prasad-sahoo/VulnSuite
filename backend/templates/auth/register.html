{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="VulnSuite Logo" width="48" height="48" style="margin-bottom: 8px;" />
      <h1>Create Account</h1>
      <p>Join VulnSuite</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      {% if not config.VULN_CSRF %}
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      {% endif %}

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Choose a password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="mt-2 text-muted" style="text-align:center;font-size:0.85rem;">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
