{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="VulnSuite Logo" width="48" height="48" style="margin-bottom: 8px;" />
      <h1>VulnSuite</h1>
      <p>Sign in to your account</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      {% if not config.VULN_CSRF %}
      
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      {% endif %}
      

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               placeholder="Enter username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               placeholder="Enter password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign In</button>
    </form>

    <p class="mt-2 text-muted" style="text-align:center;font-size:0.85rem;">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
  </div>
</div>
{% endblock %}
