{% extends "base.html" %}
{% block title %}Import Logo{% endblock %}
{% block content %}
<div style="max-width:600px;margin:0 auto;">
  <div class="page-header">
    <div>
      <h1 class="page-title">🖼 Import Company Logo</h1>
      <p class="page-sub">Load logo from a remote URL</p>
    </div>
    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-ghost btn-sm">← Admin</a>
  </div>

  {% if config.VULN_SSRF %}
  
  {% else %}
  
  {% endif %}

  <div class="card">
    <form method="POST" action="{{ url_for('webhook.import_logo') }}">
      <div class="form-group">
        <label for="logo_url">Logo URL</label>
        <input type="url" id="logo_url" name="logo_url" required
               placeholder="https://example.com/logo.png" />
      </div>
      <button type="submit" class="btn btn-primary">Import</button>
    </form>

    {% if error %}
    <div class="vuln-box mt-2">{{ error }}</div>
    {% endif %}

    {% if preview_url %}
    <div class="mt-2">
      <label>Preview:</label>
      <img src="{{ preview_url }}" alt="Imported logo"
           style="max-height:120px;margin-top:0.5rem;border-radius:8px;border:1px solid var(--border);" />
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
