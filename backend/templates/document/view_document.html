{% extends "base.html" %}
{% block title %}Viewing: {{ filename }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">📄 {{ filename }}</h1>
    <p class="page-sub mono" style="font-size:0.8rem;">{{ path }}</p>
  </div>
  <a href="{{ url_for('document.view_document') }}" class="btn btn-ghost btn-sm">← Documents</a>
</div>

{% if config.VULN_PATH_TRAVERSAL %}

{% endif %}

<div class="card">
  <div class="card-header">
    <span class="card-title">File Contents</span>
    <span class="text-muted mono" style="font-size:0.75rem;">{{ content | length }} bytes</span>
  </div>
  <pre>{{ content }}</pre>
</div>

{% endblock %}
