<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="vsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <polygon points="50,6 88,24 88,64 50,94 12,64 12,24" 
           fill="url(#shieldGrad)" 
           stroke="url(#vsGradient)" 
           stroke-width="3.5" 
           stroke-linejoin="round" />

  <!-- Inner Cyber Nodes & Lines -->
  <path d="M50 14 L80 29 L80 60 L50 84 L20 60 L20 29 Z" 
        fill="none" 
        stroke="#6366f1" 
        stroke-width="1.2" 
        stroke-dasharray="3,2" 
        opacity="0.45" />

  <!-- Stylized Modern 'V' and Security Node Core -->
  <g filter="url(#glow)">
    <!-- Left Wing of V -->
    <path d="M28 32 L50 72 L42 72 L22 36 Z" fill="url(#vsGradient)"/>
    <!-- Right Wing of V -->
    <path d="M72 32 L50 72 L58 72 L78 36 Z" fill="url(#vsGradient)"/>
    <!-- Central Security Keyhole / Core Node -->
    <circle cx="50" cy="40" r="5" fill="#38bdf8" />
    <path d="M47 43 L53 43 L55 54 L45 54 Z" fill="#38bdf8" />
    <circle cx="50" cy="72" r="3" fill="#a855f7" />
  </g>
</svg>
